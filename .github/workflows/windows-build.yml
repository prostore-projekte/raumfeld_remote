# Baut Raumfeld Remote auf einem Windows-Rechner von GitHub zu einer fertigen .exe
# und packt yt-dlp.exe und ffmpeg.exe in den Ordner "tools" daneben.
# Ergebnis: Zip-Datei "RaumfeldRemote-windows" unter Actions -> Lauf -> Artifacts.
name: Windows-Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:   # manuell startbar ueber den Reiter "Actions"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyflakes

      - name: Pruefen (Syntax, pyflakes, Import der GUI)
        run: |
          python -m pyflakes raumfeld_remote
          # Import laedt tkinter/customtkinter, oeffnet aber noch kein Fenster
          python -c "import raumfeld_remote.gui as g; import raumfeld_remote; print('Version', raumfeld_remote.__version__)"

      - name: .exe bauen (PyInstaller)
        run: pyinstaller --noconsole --onefile --name RaumfeldRemote --collect-all customtkinter start.pyw

      - name: yt-dlp und ffmpeg herunterladen
        run: |
          $paket = "paket/RaumfeldRemote"
          New-Item -ItemType Directory -Force "$paket/tools" | Out-Null
          Copy-Item dist/RaumfeldRemote.exe $paket
          Copy-Item README.md, CHANGELOG.md $paket
          # yt-dlp: offizielle Windows-Datei der letzten Version
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$paket/tools/yt-dlp.exe"
          # ffmpeg: Windows-Build von BtbN (GPL), nur ffmpeg.exe und ffprobe.exe uebernehmen
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination "$paket/tools"
          # deno: JavaScript-Laufzeit, die yt-dlp fuer YouTube braucht
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath "$paket/tools" -Force
          & "$paket/tools/deno.exe" --version
          & "$paket/tools/yt-dlp.exe" --version
          & "$paket/tools/ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Starttest der .exe (10 Sekunden, darf nicht abstuerzen)
        run: |
          $p = Start-Process paket/RaumfeldRemote/RaumfeldRemote.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "RaumfeldRemote.exe wurde vorzeitig beendet (Code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "Starttest OK"

      - name: start.bat testen (Pruefung + Nachinstallation + Start)
        shell: cmd
        run: |
          rem Frischer Zustand: keine .venv, kein tools-Ordner -> start.bat muss alles nachinstallieren
          if exist .venv rmdir /s /q .venv
          if exist tools rmdir /s /q tools
          call start.bat
          if errorlevel 1 exit /b 1
          if not exist tools\yt-dlp.exe exit /b 1
          if not exist tools\ffmpeg.exe exit /b 1
          if not exist tools\deno.exe exit /b 1
          tools\deno.exe --version || exit /b 1
          rem Runner laeuft als Administrator -> start.bat muss die Firewall-Regel angelegt haben
          netsh advfirewall firewall show rule name="Raumfeld Remote" | find "8765-8814" || exit /b 1
          rem 10 Sekunden warten, dann muss pythonw (die Oberflaeche) noch laufen
          ping -n 11 127.0.0.1 >nul
          tasklist /FI "IMAGENAME eq pythonw.exe" | find /I "pythonw.exe" && goto ok
          echo FEHLER: pythonw laeuft nicht. Fehlerprotokoll:
          type "%APPDATA%\RaumfeldRemote\fehler.log"
          echo Direkter Start mit Konsole zur Diagnose:
          .venv\Scripts\python.exe -c "import raumfeld_remote.gui"
          exit /b 1
          :ok
          taskkill /F /IM pythonw.exe >nul
          echo start.bat-Test OK

      - uses: actions/upload-artifact@v4
        with:
          name: RaumfeldRemote-windows
          path: paket/

  # -------------------------------------------------------------------------
  # Zentraler Dienst (Web-Oberflaeche) + Installer (Inno Setup)
  # Ergebnis: Artifact "RaumfeldRemote-Setup" mit RaumfeldRemote-Setup-x.y.z.exe
  # Der Installer wird auf dem Runner wirklich installiert, geprueft und
  # wieder deinstalliert.
  # -------------------------------------------------------------------------
  dienst-installer:
    runs-on: windows-latest
    permissions:
      contents: write   # noetig, um auf main ein Release mit der Setup-EXE anzulegen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dienst.txt pyinstaller pyflakes

      - name: Pruefen (pyflakes, Import)
        run: |
          python -m pyflakes raumfeld_remote dienst_start.py
          python -c "import raumfeld_remote.web, raumfeld_remote.zentrale, raumfeld_remote.dienst, tidalapi"

      - name: Dienst-EXE bauen (PyInstaller, Ordner-Variante)
        run: pyinstaller --noconfirm --onedir --name RaumfeldRemoteDienst --add-data "raumfeld_remote/web;raumfeld_remote/web" --hidden-import tidalapi --collect-submodules tidalapi dienst_start.py

      - name: Paket zusammenstellen (Dienst, WinSW, yt-dlp, ffmpeg, deno)
        run: |
          $p = "paket_dienst"
          New-Item -ItemType Directory -Force "$p/tools" | Out-Null
          Copy-Item dist/RaumfeldRemoteDienst/* $p -Recurse
          Copy-Item installer/RaumfeldRemote-Dienst.xml $p
          Copy-Item README.md, CHANGELOG.md $p
          # WinSW: macht aus der EXE einen Windows-Dienst
          Invoke-WebRequest https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe -OutFile "$p/RaumfeldRemote-Dienst.exe"
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$p/tools/yt-dlp.exe"
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination "$p/tools"
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath "$p/tools" -Force
          Get-ChildItem $p -File | Select-Object Name, Length | Out-Host

      - name: Installer bauen (Inno Setup)
        id: installer
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $version = python -c "import raumfeld_remote; print(raumfeld_remote.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\raumfeld_remote.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Installer testen (installieren, Dienst, Web, Firewall, deinstallieren)
        run: |
          $setup = Get-ChildItem dist_installer\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait
          # Auf die Web-Oberflaeche warten (Dienst startet im Hintergrund)
          $antwort = $null
          for ($i = 0; $i -lt 30 -and -not $antwort; $i++) {
            Start-Sleep -Seconds 2
            try { $antwort = Invoke-WebRequest http://localhost:8766/einrichten -UseBasicParsing } catch { }
          }
          if (-not $antwort -or $antwort.Content -notmatch 'Passwort') {
            Get-Content install.log -Tail 40
            Get-ChildItem C:\ProgramData\RaumfeldRemote\logs -File -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
            throw "Web-Oberflaeche antwortet nicht"
          }
          $dienst = Get-Service RaumfeldRemote
          Write-Host "Dienst: $($dienst.Status), Starttyp: $($dienst.StartType)"
          if ($dienst.Status -ne 'Running') { throw "Dienst laeuft nicht" }
          # Firewall: Programmregel fuer die Dienst-EXE (gilt fuer alle Ports und die UDP-Suche)
          $regel = netsh advfirewall firewall show rule name="Raumfeld Remote Dienst" verbose | Out-String
          Write-Host $regel
          if ($regel -notmatch 'RaumfeldRemoteDienst\.exe') { throw "Firewall-Programmregel fehlt" }
          # Verknuepfung zeigt auf den neuen Standard-Port
          Get-Content "C:\Program Files\RaumfeldRemote\Raumfeld Remote.url" | Out-Host
          # Port-Wechsel ueber die Web-Oberflaeche testen: Passwort einrichten, Port aendern,
          # Dienst neu starten lassen (WinSW startet ihn nach Exit-Code 1 neu), neuen Port pruefen
          $web = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-WebRequest http://localhost:8766/einrichten -Method Post -WebSession $web -UseBasicParsing `
            -Body @{ passwort = 'CiTest-12345'; passwort2 = 'CiTest-12345' } | Out-Null
          $antwort = Invoke-RestMethod http://localhost:8766/api/einstellungen -Method Post -WebSession $web `
            -ContentType 'application/json' -Body '{"web_port": 8767}'
          Write-Host "Einstellungen: $($antwort.meldung)"
          if (-not $antwort.neustart) { throw "Portaenderung meldet keinen noetigen Neustart" }
          Invoke-RestMethod http://localhost:8766/api/dienst/neustart -Method Post -WebSession $web `
            -ContentType 'application/json' -Body '{}' | Out-Host
          $antwort = $null
          for ($i = 0; $i -lt 30 -and -not $antwort; $i++) {
            Start-Sleep -Seconds 2
            try { $antwort = Invoke-WebRequest http://localhost:8767/login -UseBasicParsing } catch { }
          }
          if (-not $antwort) {
            Get-Content C:\ProgramData\RaumfeldRemote\stream.log -Tail 20
            throw "Dienst nach Neustart nicht auf dem neuen Port 8767 erreichbar"
          }
          Write-Host "Neustart und Portwechsel OK"
          Get-Content "C:\Program Files\RaumfeldRemote\Raumfeld Remote.url" | Out-Host
          foreach ($t in 'yt-dlp.exe','ffmpeg.exe','deno.exe') {
            if (-not (Test-Path "C:\Program Files\RaumfeldRemote\tools\$t")) { throw "$t fehlt" }
          }
          Get-Content C:\ProgramData\RaumfeldRemote\stream.log -Tail 10
          # Deinstallieren und pruefen, dass der Dienst weg ist
          Start-Process "C:\Program Files\RaumfeldRemote\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 5
          if (Get-Service RaumfeldRemote -ErrorAction SilentlyContinue) { throw "Dienst nach Deinstallation noch vorhanden" }
          Write-Host "Installer-Test OK"

      # Auf main: Release "vX.Y.Z" mit der Setup-EXE anlegen (bzw. Datei ersetzen),
      # damit der Installer direkt auf der Repo-Seite unter "Releases" liegt.
      - name: Release veroeffentlichen (nur main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.installer.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem dist_installer\*.exe).FullName --clobber
          } else {
            gh release create $tag (Get-ChildItem dist_installer\*.exe).FullName --title "Raumfeld Remote $tag" --notes "Installer für den zentralen Dienst mit Web-Oberfläche. Änderungen siehe CHANGELOG.md."
          }
          if ($LASTEXITCODE -ne 0) { throw "Release fehlgeschlagen" }

      - uses: actions/upload-artifact@v4
        with:
          name: RaumfeldRemote-Setup
          path: dist_installer/*.exe
