<!doctype html>
<!-- einrichten.html - Ersteinrichtung des Zugangspassworts (nur direkt am Server erreichbar) -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raumfeld Remote – Einrichten</title>
<style>
  :root { --bg:#f4f5f7; --karte:#fff; --text:#1d2330; --akzent:#2f6fde; --fehler:#c0392b; --rand:#d6d9e0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --karte:#1e232b; --text:#e6e9ef; --rand:#353b46; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--text); font:16px/1.5 "Segoe UI", system-ui, sans-serif; }
  form { background:var(--karte); padding:28px; border-radius:12px; width:min(380px, 90vw);
         box-shadow:0 4px 20px rgba(0,0,0,.12); }
  h1 { font-size:20px; margin:0 0 8px; }
  input { width:100%; box-sizing:border-box; padding:10px; margin-top:10px; border:1px solid var(--rand);
          border-radius:8px; background:transparent; color:inherit; font-size:16px; }
  button { margin-top:16px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--akzent);
           color:#fff; font-size:16px; cursor:pointer; }
  .fehler { color:var(--fehler); min-height:1.5em; margin:8px 0 0; }
</style>
</head>
<body>
<form method="post" action="/einrichten">
  <h1>Raumfeld Remote einrichten</h1>
  <p>Lege das Passwort fest, mit dem sich alle Kolleginnen und Kollegen anmelden (mindestens 8 Zeichen).</p>
  <input type="password" name="passwort" placeholder="Passwort" minlength="8" required autofocus>
  <input type="password" name="passwort2" placeholder="Passwort wiederholen" minlength="8" required>
  <p class="fehler" id="fehler"></p>
  <button type="submit">Speichern</button>
</form>
<script>
  if (new URLSearchParams(location.search).get("fehler"))
    fehler.textContent = "Passwörter stimmen nicht überein oder sind kürzer als 8 Zeichen.";
</script>
</body>
</html>
